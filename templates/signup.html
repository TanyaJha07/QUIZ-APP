<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    body {
      font-family: 'Poppins', Arial, sans-serif;
      background-color: #eef1f6;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 100%;
      max-width: 400px;
      margin: 50px auto;
      padding: 25px;
      background: white;
      border-radius: 10px;
      box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
    }
    h2 {
      color: #333;
      margin-bottom: 20px;
    }
    input, select {
      width: calc(100% - 16px);
      padding: 8px;
      margin: 10px 0;
      border: 2px solid #3a3d98;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      background-color: #3a3d98;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease;
      font-weight: bold;
    }
    .btn:hover {
      background-color: #272a73;
    }
    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-top: 10px;
      font-size: 14px;
    }
    .login-link {
      margin-top: 15px;
      font-size: 14px;
    }
    .login-link a {
      color: #3a3d98;
      text-decoration: none;
      font-weight: bold;
    }
    .login-link a:hover {
      text-decoration: underline;
    }
    .alert {
      padding: 8px;
      margin: 8px auto;
      width: 90%;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
    }
    .alert-success { background-color: #2ecc71; color: white; }
    .alert-danger { background-color: #e74c3c; color: white; }
    .alert-warning { background-color: #f39c12; color: white; }
  </style>
</head>
<body>
  {% with messages = get_flashed_messages(with_categories=True) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  
  <div class="container">
    <h2>Sign Up</h2>
    <form action="/signup" method="POST">
      <input type="text" name="username" placeholder="Username" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <input type="text" name="qualification" placeholder="Qualification" required>
      <label for="dob">Date of Birth:</label>
      <input type="date" name="dob" required>
      <button type="submit" class="btn">Sign Up</button>
    </form>
    <p class="login-link">Already a member? <a href="/login">Login</a></p>
  </div>
</body>
</html>

{% extends 'base.html' %}

{% block title %}Edit Question{% endblock %}

{% block content %}
<style>
.container {
  max-width: 600px;
  margin: 50px auto;
  background: #fff;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  text-align: left;
}
.container h2 {
  text-align: center;
  color: #34495e;
  margin-bottom: 20px;
}
.form-group {
  margin-bottom: 15px;
}
.form-group label {
  font-weight: bold;
  display: block;
  margin-bottom: 5px;
}
.form-group input,
.form-group textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
}
.btn {
  display: inline-block;
  padding: 0.75rem;
  font-size: 1rem;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background-color: #3a3d98;
  color: #fff;
  text-decoration: none;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
  transition: background 0.3s;
  width: 100%;
}
.btn:hover {
  background-color: #272a73;
}
</style>

<div class="container">
  <h2>Edit Question</h2>
  <form method="POST">
    <div class="form-group">
      <label for="question_statement">Question Statement</label>
      <textarea name="question_statement" id="question_statement" required>{{ question.question_statement }}</textarea>
    </div>
    <div class="form-group">
      <label for="option1">Option 1</label>
      <input type="text" name="option1" id="option1" value="{{ question.option1 }}" required>
    </div>
    <div class="form-group">
      <label for="option2">Option 2</label>
      <input type="text" name="option2" id="option2" value="{{ question.option2 }}" required>
    </div>
    <div class="form-group">
      <label for="option3">Option 3</label>
      <input type="text" name="option3" id="option3" value="{{ question.option3 }}" required>
    </div>
    <div class="form-group">
      <label for="option4">Option 4</label>
      <input type="text" name="option4" id="option4" value="{{ question.option4 }}" required>
    </div>
    <div class="form-group">
      <label for="correct_answer">Correct Answer</label>
      <input type="text" name="correct_answer" id="correct_answer" value="{{ question.correct_answer }}" required>
    </div>
    <button type="submit" class="btn">Update Question</button>
  </form>
</div>
{% endblock %}

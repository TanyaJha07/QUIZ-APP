{% extends 'base.html' %}

{% block title %}Quizzy - Admin Dashboard{% endblock %}

{% block content %}
    <h1>Edit Subject</h1>
    <form method="POST">
        <input type="hidden" name="action" value="edit_subject">
        <div class="mb-3">
            <label class="form-label fw-bold">Subject Name</label>
            <input type="text" class="form-control rounded-3 shadow-sm" name="subject_name" value="{{ subject.subject_name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Description</label>
            <input type="text" class="form-control rounded-3 shadow-sm" name="subject_description" value="{{ subject.description }}">
        </div>
        <div class="text-center mt-3">
            <button type="submit" class="btn btn-primary rounded-3 px-4 py-2 shadow">✏️ Edit Subject</button>
        </div>
    </form>
{% endblock %}

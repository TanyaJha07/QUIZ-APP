<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body {
      font-family: 'Poppins', Arial, sans-serif;
      background-color: #eef1f6;
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-container {
      text-align: center;
      padding: 20px;
      border-radius: 8px;
      background: white;
      box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    label {
      font-size: 14px;
      font-weight: bold;
    }
    input {
      padding: 8px;
      width: 200px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #3a3d98;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    button:hover {
      background-color: #272a73;
    }
    .alert {
      padding: 8px;
      margin: 8px auto;
      width: 90%;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
    }
    .alert-success { background-color: #2ecc71; color: white; }
    .alert-danger { background-color: #e74c3c; color: white; }
    .alert-warning { background-color: #f39c12; color: white; }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login</h2>
    <form action="{{ url_for('login') }}" method="POST">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
  
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>
  
      <button type="submit">Login</button>
    </form>
  </div>
  {% with messages = get_flashed_messages(with_categories=True) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
</body>
</html>

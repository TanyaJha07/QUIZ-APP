<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f5f5f5;">

    <div style="text-align: center; padding: 20px; border-radius: 8px; background: white; box-shadow: 0px 4px 10px rgba(0,0,0,0.1);">
        <h2>Login</h2>
        <form action="{{ url_for('login') }}" method="POST" style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required style="padding: 8px; width: 200px; border: 1px solid #ccc; border-radius: 4px;">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required style="padding: 8px; width: 200px; border: 1px solid #ccc; border-radius: 4px;">

            <button type="submit" style="background-color: #34495e; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer;">Login</button>
        </form>
    </div>
    {% with messages = get_flashed_messages(with_categories=True) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}

</body>
</html>
